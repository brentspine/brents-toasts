name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Rename dist files with version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir release
          cp dist/index.esm.js       "release/brents-toasts-${VERSION}.esm.js"
          cp dist/index.esm.min.js   "release/brents-toasts-${VERSION}.esm.min.js"
          cp dist/index.cjs         "release/brents-toasts-${VERSION}.cjs"
          cp dist/index.umd.js       "release/brents-toasts-${VERSION}.umd.js"
          cp dist/index.umd.min.js   "release/brents-toasts-${VERSION}.umd.min.js"
          cp dist/index.d.ts         "release/brents-toasts-${VERSION}.d.ts"

      - name: Determine prerelease status
        id: prerelease
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ -(alpha|beta|rc) ]]; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine previous tag
        id: prevtag
        if: steps.prerelease.outputs.flag == ''
        run: |
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          echo "tag=${PREV}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        if: steps.prerelease.outputs.flag == ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PREV_TAG: ${{ steps.prevtag.outputs.tag }}
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          node scripts/generate-changelog.js

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "${{ steps.prerelease.outputs.flag }}" ]; then
            gh release create "${GITHUB_REF_NAME}" release/* \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "docs/changelogs/${VERSION}.md"
          else
            gh release create "${GITHUB_REF_NAME}" release/* \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --prerelease
          fi

      - name: Build demo (Angular)
        if: steps.prerelease.outputs.flag == ''
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "{\"version\": \"${VERSION}\"}" > demo/public/version.json
          npm ci --prefix demo
          npm --prefix demo run test
          npm --prefix demo run build -- --base-href /brents-toasts/
          cp demo/src/app/data/options.json "/tmp/options-${VERSION}.json"

      - name: Deploy demo to brentspine.github.io
        if: steps.prerelease.outputs.flag == ''
        env:
          GH_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/Brentspine/brentspine.github.io.git" pages-repo

          # Replace the always-latest build at the root — filenames are
          # content-hashed and change on every build, so everything except the
          # permanent per-version archive is pruned before copying the new one in.
          find pages-repo/brents-toasts -mindepth 1 -maxdepth 1 ! -name versions -exec rm -rf {} +
          cp -r demo/dist/demo/browser/. pages-repo/brents-toasts/

          # version list, used by the demo's version browser
          node -e "
            const fs = require('fs');
            const path = 'pages-repo/brents-toasts/versions/versions.json';
            const list = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : [];
            if (!list.includes('${VERSION}')) list.push('${VERSION}');
            list.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
            fs.writeFileSync(path, JSON.stringify(list, null, 2) + '\n');
          "

          cd pages-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add brents-toasts
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Update brents-toasts demo to v${VERSION}"
            # deploy-demo.yml can push to this same repo concurrently (see
            # RELEASING.md); retry on a non-fast-forward push instead of
            # failing the job outright.
            for i in 1 2 3 4 5; do
              git push && break
              echo "Push rejected (attempt $i), retrying..."
              git fetch origin main
              git rebase origin/main
              sleep $((RANDOM % 5 + 1))
            done
          fi

      - name: Commit changelog + options snapshot to main
        # Runs even if the demo deploy above failed (e.g. lost a push race
        # with deploy-demo.yml) — the changelog/options commit must not be
        # skipped just because the demo redeploy didn't land.
        if: always() && steps.prerelease.outputs.flag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp "docs/changelogs/${VERSION}.md" "/tmp/changelog-${VERSION}.md"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p docs/changelogs docs/options
          cp "/tmp/changelog-${VERSION}.md" "docs/changelogs/${VERSION}.md"
          cp "/tmp/options-${VERSION}.json" "docs/options/${VERSION}.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "docs/changelogs/${VERSION}.md" "docs/options/${VERSION}.json"
          if git diff --cached --quiet; then
            echo "No changelog/options changes to commit"
          else
            git commit -m "Add changelog and options snapshot for v${VERSION}"
            git push origin main
          fi
