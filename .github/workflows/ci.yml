name: CI

# Runs the full test suite (library + demo) on every pull request and on
# pushes to main, so a broken build/test never reaches a tag push in
# release.yml. release.yml re-runs the library suite anyway right before
# publishing, but this is what actually gates PRs.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets codecov-action authenticate via OIDC instead of a stored
      # CODECOV_TOKEN secret — Codecov allows this for public repos pushing
      # to an unprotected branch (see README's coverage badge).
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Test demo
        run: |
          npm ci --prefix demo
          npm --prefix demo run test
