name: CI

# Runs the full test suite (library + demo) on every pull request and on
# pushes to main, so a broken build/test never reaches a tag push in
# release.yml. release.yml re-runs the library suite anyway right before
# publishing, but this is what actually gates PRs.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      - name: Test demo
        run: |
          npm ci --prefix demo
          npm --prefix demo run test
