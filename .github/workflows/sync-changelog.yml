name: Sync changelog to release

on:
  push:
    branches: [main]
    paths:
      - 'docs/changelogs/*.md'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update matching GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANGED="$(git diff --name-only "${{ github.event.before }}" "${{ github.event.after }}" -- 'docs/changelogs/*.md')"
          for f in $CHANGED; do
            VERSION="$(basename "$f" .md)"
            TAG="v${VERSION}"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --notes-file "$f"
              echo "Synced $TAG from $f"
            else
              echo "No release found for $TAG, skipping $f"
            fi
          done
