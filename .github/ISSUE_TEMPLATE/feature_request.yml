name: Feature request
description: Suggest a new option, API, or capability for the library, demo, or docs.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Feature requests that explain the underlying problem (not just the desired API) are much easier to design well.

  - type: dropdown
    id: area
    attributes:
      label: Where should this apply?
      options:
        - Library (src/, public API)
        - Demo / Playground
        - Docs
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case or limitation you're running into. Avoid jumping straight to the solution here — that's the next field.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen? A sketch of the API/option shape is helpful if you have one in mind.
      placeholder: |
        e.g. toasts.showToast('msg', { newOption: true })
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're currently using, or other approaches you considered.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else — links, screenshots, similar features in other libraries.
    validations:
      required: false
